[package]
name = "rustify"
version = "0.2.0"
description = "Lightweight native Spotify client"
edition = "2021"
rust-version = "1.82"
# Personal project, not published to crates.io or distributed. No `license`
# field for the same reason (see cargo-deny's [licenses.private] setting in
# deny.toml, which excludes unpublished workspace crates from the license
# check rather than requiring one).
publish = false

[lib]
name = "rustify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
# Debug-only automation bridge; gated behind `cfg(debug_assertions)` in lib.rs
# AND the `mcp-bridge` Cargo feature (off by default), so it is absent from
# the default/release dependency graph entirely, not just inactive at runtime.
tauri-plugin-mcp-bridge = { version = "0.12", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dotenvy = "0.15"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
http = "1"
biquad = "0.6"
# Keep this aligned with the version used by librespot's rodio backend. It is
# used only for device discovery; decoded samples still flow through
# librespot's Sink contract.
cpal = "0.16"

# Experimental Spotify Jams module (src/jams/). Self-contained; these only
# exist to serve it. tokio-tungstenite is required by dealer.rs; the rest are
# client-token minting, persisted-query config, and tracing.
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
# The "log" feature makes `tracing` events fall through to the `log` crate when
# no tracing subscriber is installed. The app installs env_logger, not a
# subscriber, so without this every warn!/debug! in `jams/` is silently
# discarded — including the one line that says which URL returned the 400.
tracing = { version = "0.1", features = ["log"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "native-tls",
] }

# `with-libmdns` (a librespot default feature) is deliberately OFF: zeroconf
# discovery is only needed for the "log in from another device" flow. We
# authenticate via OAuth, and a logged-in Spirc advertises itself through
# Spotify's dealer/websocket, not mDNS. Dropping it removes a dependency tree
# we never execute.
librespot = { git = "https://github.com/librespot-org/librespot.git", rev = "b5f4631f950068b9521c61fa2255171c97568a3c", default-features = false, features = [
    "native-tls",
    "rodio-backend",
] }
librespot-oauth = { git = "https://github.com/librespot-org/librespot.git", rev = "b5f4631f950068b9521c61fa2255171c97568a3c", default-features = false, features = [
    "native-tls",
] }
# DPAPI (CryptProtectData/CryptUnprotectData) for encrypting tokens.json at
# rest, bound to the current Windows user. Used only from auth.rs. The app is
# Windows-only already (Acrylic window effects, NSIS bundling), so this adds
# no new platform constraint.
windows = { version = "0.62", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }
# Generates src/lib/generated/*.ts from the #[derive(TS)] boundary types
# (PlaybackState, AuthState, TrackInfo, Device, ConnectionStatus,
# StreamQuality) when built with `--features ts-rs-export`. The derive itself
# lives on real struct definitions (not test-only code), so this has to be a
# regular optional dependency rather than a dev-dependency; gating it behind
# a feature (like `mcp-bridge`) still keeps it out of the default/release
# dependency graph. See CLAUDE.md and `npm run gen:types`.
ts-rs = { version = "12", optional = true }

# Decodes DJ narration clips (short synthesized-speech MP3s fetched from
# Spotify's client-tts CDN, see spotify/dj.rs and narration.rs). Nothing else
# in the dependency graph decodes MP3 from Rustify's own code: librespot links
# a copy of symphonia transitively for track playback, but that instance is
# private to the librespot crate, not reachable from here. `mp3` only, no
# default features, to skip the container demuxers/other codecs this narrow
# use never needs. Pinned to "0.5" to match librespot-playback's own
# symphonia version exactly (see its Cargo.toml) so the dependency graph
# resolves one copy instead of two. MPL-2.0, already on deny.toml's allow-list.
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

[features]
default = []
# Enables the tauri-mcp automation bridge for driving/screenshotting the UI
# from outside during development. Off by default so the dependency (and its
# unauthenticated loopback control channel) is absent from ordinary and
# release builds. Use `cargo check --no-default-features --features mcp-bridge`
# or `npm run tauri dev -- --features mcp-bridge` to enable it locally.
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]
# See the ts-rs dependency comment above.
ts-rs-export = ["dep:ts-rs"]

[dev-dependencies]
# Only used by examples/jam_demo.rs to show the module's tracing output.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Isolated temp dirs for auth.rs's token-persistence tests.
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
